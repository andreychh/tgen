name: lint
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        task:
          - go
          - md
          - yml
          - toml
          - gha
          - renovate
          - reuse
          - typos
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
        with:
          version: v2026.7.18
      - run: task lint:${{ matrix.task }}
