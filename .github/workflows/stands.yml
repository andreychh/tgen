name: stands
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  stands:
    strategy:
      fail-fast: false
      matrix:
        target:
          - go
          - python
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d  # v5.2.4
        with:
          version: v2026.10.21
      - run: task stands:ci:${{ matrix.target }}
