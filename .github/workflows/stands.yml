name: stands
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  stands:
    strategy:
      fail-fast: false
      matrix:
        target:
          - go
          - python
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea  # v4.2.1
        with:
          version: v2026.7.7
      - run: task stands:ci:${{ matrix.target }}
