# yaml-language-server: $schema=https://mise.jdx.dev/schema/mise.json

[settings]
always_keep_download = false
legacy_version_file = false

[tools]
"go" = "1.27.1"
"github:caarlos0/svu" = "3.4.1"
"github:crate-ci/typos" = "1.50.1"
"github:golangci/golangci-lint" = "2.13.2"
"github:goreleaser/goreleaser" = "2.18.1"
"github:go-task/task" = "3.53.1"
"github:rhysd/actionlint" = "1.7.12"
"github:tamasfe/taplo" = "0.10.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"
"npm:markdownlint-cli2" = "0.23.2"
"npm:renovate" = { version = "44.69.9", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }
"pipx:reuse" = "6.2.0"
"pipx:yamllint" = "1.38.0"

# indirect
"node" = "24.21.0"
"github:koalaman/shellcheck" = "0.11.0"

[env]
_.file = ".env"
GOROOT = ""
